<!DOCTYPE html>

  <title>JOS — Prototipe Jasa &amp; Toko</title>
  <style>#josBookingProductsToggle[hidden],#josBookingProducts[hidden]{display:none!important;visibility:hidden!important}</style>
  <style>
    :root{--blue:#21885b;--deep:#176344;--cyan:#b6e8c8;--ink:#214b3b;--pale:#f0fff4;--line:#b8dfc5}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(180deg,#d8f4e2,#f8fff9 38%,#e5f6e9);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .page{width:min(100%,760px);margin:auto;padding:12px 12px 26px}
    .brand{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 7px 0 #a5dfff,0 12px 22px #1684c733}
    .hero{position:relative;overflow:hidden;margin:14px 0 18px;padding:22px 20px;border:2px solid #fff;border-radius:20px;background:linear-gradient(125deg,#176344,#21885b 62%,#65c98e);color:white;box-shadow:0 8px 0 #14553a,0 13px 22px #21885b33}
    .hero:after{content:"";position:absolute;width:220px;height:220px;border:22px solid #ffffff18;border-radius:50%;right:-50px;top:-65px}
    .hero h1{position:relative;margin:0 0 7px;font-size:clamp(27px,6vw,42px);line-height:1.02;letter-spacing:-.7px}
    .hero p{position:relative;margin:0;max-width:460px;font-size:15px;line-height:1.5}
    .section-head{display:flex;align-items:center;gap:11px;margin:20px 2px 12px}
    .grid-icon{width:35px;height:35px;flex:0 0 35px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .grid-icon i{display:block;background:linear-gradient(145deg,#22bfff,#21885b);border-radius:5px;box-shadow:inset 0 2px 2px #ffffff8c,0 2px 0 #176344}
    .section-head h2{font-size:clamp(19px,4.7vw,26px);margin:0;color:#176344}
    .section-head p{font-size:13px;margin:3px 0 0;color:#3e6fa8}
    .count{margin-left:auto;background:#e8f8ff;border:1px solid #80caff;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}
    .services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .service{width:100%;min-width:0;min-height:88px;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border:1px solid #b8dfc5;border-radius:19px;background:linear-gradient(155deg,#fff 0%,#f0fff4 55%,#e4f7e9 100%);color:#176344;box-shadow:0 5px 0 #a8d9f3,0 8px 13px #0077c52b,inset 0 2px 2px #fff;cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s}
    .service:active,.service.selected{transform:translateY(4px);box-shadow:0 1px 0 #80bde8,0 3px 7px #0077c52b,inset 0 2px 4px #c6eaff;border-color:#21885b;background:linear-gradient(145deg,#e8f8ed,#bdeaff)}
    .icon{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:50%;font-size:27px;background:radial-gradient(circle at 32% 25%,#fff 0,#e8f8ed 46%,#ccebd5 100%);border:1px solid #a6dfff;box-shadow:inset 0 2px 4px #fff,0 3px 0 #addcf4}
    .svc-copy{min-width:0;flex:1}
    .svc-name{font-size:13px;line-height:1.18;font-weight:800;display:block}
    .svc-desc{display:block;font-size:10.5px;line-height:1.25;margin-top:5px;color:#2e649e}
    .svc-price{display:block;margin-top:6px;font-size:9.5px;line-height:1.35;font-weight:800;color:#075db5;background:#e6f7ff;border:1px solid #b6e5ff;border-radius:7px;padding:4px 5px}
    .arrow{flex:0 0 23px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#24baff,#21885b);color:#fff;font-size:18px;font-weight:bold;box-shadow:0 3px 0 #176344, inset 0 1px 2px #ffffffa8}
    #booking{display:none}
    #booking.open{display:block}
    .panel{margin-top:20px;padding:15px;border-radius:18px;border:1px solid #b8dfc5;background:linear-gradient(145deg,#e5f8ff,#cceeff);box-shadow:0 5px 0 #b2dff5}
    .panel h2{font-size:18px;margin:0 0 5px;color:#176344}
    .panel .sub{font-size:12px;line-height:1.4;margin:0 0 13px;color:#3d6e9e}
    label{display:block;font-weight:700;font-size:12px;margin:10px 0 5px;color:#174d88}
    input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #b8dfc5;background:#fff;font:inherit;color:#123b76;outline:none;box-shadow:inset 0 2px 3px #0a5c9c0c}
    input:focus,select:focus,textarea:focus{border-color:#21885b;box-shadow:0 0 0 3px #0a90ff1b}
    textarea{resize:vertical;min-height:78px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px 16px;border:1px solid #21885b;border-radius:14px;background:linear-gradient(180deg,#23b9ff 0%,#21885b 48%,#176344 100%);color:#fff;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 #06449c,0 8px 13px #0068bd30,inset 0 2px 2px #ffffff80;text-shadow:0 1px 1px #00428c;transition:transform .12s,box-shadow .12s}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #06449c,inset 0 2px 4px #004b9b}
    .btn.secondary{background:linear-gradient(180deg,#fff,#e4f7e9);color:#0755ae;text-shadow:none;border-color:#8dcefa;box-shadow:0 4px 0 #9bcbe8,0 6px 10px #0068bd20,inset 0 2px 2px #fff}
    .share-link{display:flex;gap:8px;align-items:stretch}
    .share-link input{min-width:0;flex:1;font-size:12px}
    .share-link .btn{width:auto;min-width:110px;margin-top:0;padding:10px;font-size:12px}
    .share-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .share-buttons .btn{font-size:12px;padding:12px 8px;margin-top:10px}
    .whatsapp{background:linear-gradient(#30df85,#00a94f);border-color:#008c42;box-shadow:0 4px 0 #007a3b,0 6px 10px #0068bd20}
    .footer{text-align:center;color:#fff;background:linear-gradient(130deg,#101d30,#17283f);border-radius:48% 48% 12px 12px / 22px 22px 12px 12px;margin:24px -12px -26px;padding:28px 12px 24px;font-size:12px;line-height:1.8;box-shadow:0 -6px 0 #0787ed}
    .footer strong{font-size:14px}
    .price-box{margin-top:12px;padding:13px;border:1px solid #80caff;border-radius:14px;background:#fff;box-shadow:0 3px 0 #b7e3fa}.price-box strong{color:#176344}.price-total{font-size:21px;font-weight:900;color:#0570d5;margin-top:5px}.muted{font-size:11px;color:#537ba4;line-height:1.4}.file-input{padding:10px;background:#fff}.note{font-size:11px;line-height:1.45;color:#376a9d;background:#f4fcff;border:1px solid #b5e0fb;padding:10px;border-radius:12px;margin-top:12px}
    @media(max-width:420px){.page{padding:8px 8px 22px}.services{gap:8px}.service{min-height:82px;padding:7px;gap:7px;border-radius:15px}.icon{width:39px;height:39px;flex-basis:39px;font-size:22px}.svc-name{font-size:11.5px}.svc-desc{font-size:9.5px}.arrow{width:20px;height:20px;flex-basis:20px}.count{font-size:10px;padding:7px}.hero{padding:18px 15px}.form-grid{grid-template-columns:1fr}.share-link{flex-direction:column}.share-link .btn{width:100%}}

    /* Penyesuaian proporsi: ruang, kartu, teks, dan form lebih seimbang di HP */
    .page{width:min(100%,680px);padding:12px 14px 28px}
    .brand{display:block;width:100%;max-height:250px;object-fit:contain;background:#fff;border-radius:16px;box-shadow:0 4px 12px #1684c722}
    .hero{margin:12px 0 20px;padding:clamp(18px,4vw,26px);border-radius:18px;box-shadow:0 5px 0 #14553a,0 9px 18px #21885b22}
    .hero h1{font-size:clamp(25px,5.5vw,36px);line-height:1.12;letter-spacing:-.4px}
    .hero p{font-size:clamp(13px,3.2vw,15px);line-height:1.5}
    .section-head{gap:9px;margin:22px 2px 14px;align-items:center}
    .grid-icon{width:30px;height:30px;flex-basis:30px}
    .section-head h2{font-size:clamp(18px,4.5vw,24px);line-height:1.2}
    .section-head p{font-size:12px;line-height:1.4}
    .count{padding:7px 9px;font-size:11px}
    .services{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
    .service{min-height:100px;padding:10px;gap:8px;border-radius:15px;box-shadow:0 3px 0 #a8d9f3,0 5px 10px #0077c51c,inset 0 1px 2px #fff}
    .icon{width:38px;height:38px;flex-basis:38px;font-size:21px}
    .svc-name{font-size:clamp(11px,2.9vw,13px);line-height:1.25;overflow-wrap:anywhere}
    .svc-desc{font-size:10px;line-height:1.35}
    .svc-price{font-size:10px;line-height:1.35;padding:5px 6px;margin-top:7px}
    .arrow{width:20px;height:20px;flex-basis:20px;font-size:15px}
    .panel{margin-top:18px;padding:clamp(12px,3.5vw,18px);border-radius:16px;box-shadow:0 3px 0 #b2dff5}
    .panel h2{font-size:18px;line-height:1.25}
    label{font-size:12px;line-height:1.35}
    input,select,textarea{padding:11px 12px;border-radius:10px;font-size:14px;min-width:0}
    .form-grid{gap:0 12px}
    .price-box{padding:12px;border-radius:12px}
    .price-total{font-size:clamp(19px,5vw,23px)}
    .btn{padding:13px 14px;border-radius:12px;font-size:14px}
    .footer{margin:24px -14px -28px;padding:26px 16px 22px;border-radius:30px 30px 10px 10px;box-shadow:0 -4px 0 #0787ed}
    @media(max-width:380px){
      .page{padding:8px 9px 22px}
      .services{gap:8px}
      .service{min-height:96px;padding:8px 7px;gap:6px;border-radius:13px}
      .icon{width:32px;height:32px;flex-basis:32px;font-size:18px}
      .svc-name{font-size:11px}
      .svc-desc{font-size:9px}
      .svc-price{font-size:9px;padding:4px}
      .arrow{width:18px;height:18px;flex-basis:18px}
      .count{font-size:10px;padding:6px 7px}
      .form-grid{grid-template-columns:1fr}
    }
    @media(min-width:560px){.services{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.service{min-height:110px}.icon{width:42px;height:42px;flex-basis:42px}.svc-name{font-size:13px}}

    .evidence-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0 14px}
    .evidence-item{min-width:0;border:1px solid #b5e0fb;background:#fff;border-radius:12px;padding:7px;overflow:hidden}
    .evidence-item img,.evidence-item video{display:block;width:100%;height:90px;object-fit:cover;border-radius:8px;background:#eaf6ff}
    .evidence-item .file-name{font-size:10px;line-height:1.35;word-break:break-word;margin-top:6px;color:#24547e}
    .evidence-empty{font-size:12px;color:#537ba4;background:#f4fcff;border:1px dashed #80caff;border-radius:10px;padding:10px;margin:8px 0}
    @media(max-width:360px){.evidence-preview{grid-template-columns:repeat(2,minmax(0,1fr))}}

    /* Banner JOS JASA ORANG SURUHAN sesuai desain yang dikirim */
    .brand{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#e0fff1;border-radius:16px;box-shadow:0 4px 14px #087b6222}
    body{background:linear-gradient(180deg,#e0fff1,#f5fffb 42%,#e8fff5);color:#075b52}

    /* Kartu layanan JOS: 3D, terang, interaktif dan mudah disentuh */
    .services{gap:13px;padding:5px 2px 12px}
    .service{position:relative;isolation:isolate;overflow:hidden;min-height:112px;border:2px solid #79cfff;border-radius:18px;background:linear-gradient(145deg,#ffffff 0%,#e9faff 42%,#bcecff 100%);color:#063c7b;box-shadow:0 6px 0 #1685d3,0 10px 18px #075fba38,inset 0 2px 0 #fff;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;touch-action:manipulation}
    .service::before{content:"";position:absolute;inset:0 0 auto 0;height:42%;background:linear-gradient(180deg,#ffffff9c,transparent);pointer-events:none;z-index:-1}
    .service::after{content:"";position:absolute;top:-45px;left:-80px;width:55px;height:190px;transform:rotate(28deg);background:#ffffff8a;transition:left .55s ease;pointer-events:none}
    .service:hover::after{left:130%}
    .service:hover{transform:translateY(-3px);border-color:#0099ff;box-shadow:0 9px 0 #117bce,0 16px 24px #075fba4d,inset 0 2px 0 #fff}
    .service:active,.service.selected{transform:translateY(5px) scale(.99);border-color:#005cba;background:linear-gradient(145deg,#d3f5ff,#7ed0ff);box-shadow:0 1px 0 #075fa9,0 3px 8px #075fba40,inset 0 3px 8px #0878bc26}
    .service.selected::before{background:linear-gradient(90deg,#25a9ff38,transparent)}
    .service:focus-visible{outline:3px solid #ffb02e;outline-offset:3px}
    .service .icon{background:radial-gradient(circle at 30% 20%,#fff,#d8f6ff 55%,#85d2ff);border:2px solid #69c6ff;box-shadow:0 4px 0 #60aee5,inset 0 2px 2px #fff;transition:transform .2s ease}
    .service:hover .icon{transform:scale(1.1) rotate(-5deg)}
    .service .svc-name{color:#053e85;font-weight:900}
    .service .svc-desc{color:#316b9e}
    .service .svc-price{color:#0054a6;background:#fff;border:1px solid #88d3ff;box-shadow:0 2px 0 #9ad8fa}
    .service .arrow{background:linear-gradient(145deg,#2ac7ff,#0072cf);box-shadow:0 3px 0 #07589e,0 1px 2px #fff inset}
    @media(max-width:420px){.services{gap:11px}.service{min-height:108px;padding:9px 7px;border-radius:15px}}
    @media(prefers-reduced-motion:reduce){.service,.service::after,.service .icon{transition:none}}

    /* PROTOTIPE WEBSITE JOS JASA + TOKO — lapisan tampilan baru, alur booking asli dipertahankan */
    :root{--blue:#087ac9;--deep:#07569a;--cyan:#bfeaff;--ink:#173b59;--pale:#f2f9ff;--line:#c7e5f8}
    body{background:linear-gradient(180deg,#e8f5ff 0%,#fff 45%,#edf7ff 100%);color:#173b59}
    .page{width:min(100%,760px)}
    .brand{background:#fff;box-shadow:0 5px 18px #087ac922;border:1px solid #d8edfb}
    .proto-nav{position:sticky;top:6px;z-index:20;display:flex;gap:7px;overflow-x:auto;margin:12px 0;padding:8px;background:#ffffffed;border:1px solid #cce7f8;border-radius:15px;box-shadow:0 5px 16px #07569a12;backdrop-filter:blur(8px)}
    .proto-nav.menu-collapsed{display:none}.proto-nav:not(.menu-collapsed){display:flex;flex-wrap:wrap}
    .proto-nav a{flex:1;min-width:max-content;text-align:center;text-decoration:none;color:#07569a;font-weight:800;font-size:12px;padding:10px 12px;border-radius:10px;background:#eff8ff;border:1px solid #d5ecfb}
    .proto-nav a.primary{background:linear-gradient(135deg,#0a8de0,#07569a);color:#fff;border-color:#087ac9}
    .proto-hero{position:relative;overflow:hidden;margin:12px 0 22px;padding:23px 20px;border-radius:22px;background:linear-gradient(125deg,#07569a,#087ac9 65%,#51b8f0);color:#fff;box-shadow:0 6px 0 #064a83,0 12px 22px #087ac926}
    .proto-hero:after{content:'JOS';position:absolute;right:10px;bottom:-23px;font-weight:900;font-size:92px;color:#ffffff18;letter-spacing:-5px}
    .proto-hero h1{position:relative;z-index:1;margin:0 0 8px;font-size:clamp(27px,6vw,38px);line-height:1.08}
    .proto-hero p{position:relative;z-index:1;margin:0;max-width:470px;font-size:14px;line-height:1.6}
    .hero-actions{position:relative;z-index:2;display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
    .hero-actions a{display:inline-block;text-decoration:none;padding:11px 14px;border-radius:11px;font-size:12px;font-weight:800;background:#fff;color:#07569a;box-shadow:0 3px 0 #d5ecfb}
    .hero-actions a.alt{background:#07569a;color:#fff;border:1px solid #8ed5ff;box-shadow:none}
    .section-head h2{color:#07569a}.grid-icon i{background:linear-gradient(145deg,#40baff,#087ac9);box-shadow:inset 0 2px 2px #ffffff8c,0 2px 0 #07569a}
    .count{background:#edf8ff;border-color:#9bd8fb;color:#07569a}
    .service{border-color:#c8e6f8;background:linear-gradient(155deg,#fff 0%,#f4faff 55%,#e6f5ff 100%);color:#07569a;box-shadow:0 4px 0 #c6e5f7,0 7px 13px #087ac916,inset 0 2px 2px #fff}
    .service:active,.service.selected{border-color:#087ac9;background:linear-gradient(145deg,#eaf7ff,#ccecff);box-shadow:0 1px 0 #8ccdf0,0 3px 7px #087ac922}
    .icon{background:radial-gradient(circle at 32% 25%,#fff 0,#edf8ff 46%,#cfeeff 100%);border-color:#b5e0f8;box-shadow:inset 0 2px 4px #fff,0 3px 0 #c6e5f7}
    .arrow{background:linear-gradient(#25b5f5,#087ac9);box-shadow:0 3px 0 #07569a,inset 0 1px 2px #ffffffa8}
    .panel{border-color:#c7e5f8;background:linear-gradient(145deg,#f2faff,#e3f4ff);box-shadow:0 4px 0 #c6e5f7}
    .panel h2,.price-box strong{color:#07569a}label{color:#174d70}input,select,textarea{border-color:#c7e5f8;color:#123b5e}input:focus,select:focus,textarea:focus{border-color:#087ac9;box-shadow:0 0 0 3px #087ac91b}
    .btn{background:linear-gradient(180deg,#22aaf0 0%,#087ac9 48%,#07569a 100%);border-color:#087ac9;box-shadow:0 5px 0 #064a83,0 8px 13px #0068bd20,inset 0 2px 2px #ffffff80}
    .btn.secondary{background:linear-gradient(180deg,#fff,#e8f6ff);color:#07569a;border-color:#a9dafa;box-shadow:0 4px 0 #c6e5f7,0 6px 10px #0068bd12,inset 0 2px 2px #fff}
    .price-box{border-color:#a8daf8}.price-total{color:#087ac9}.note{color:#315d7d;background:#f4fbff;border-color:#c5e6fa}
    .proto-store{scroll-margin-top:85px;margin:22px 0 20px;padding:17px;border:1px solid #c7e5f8;border-radius:20px;background:linear-gradient(145deg,#fff,#eef8ff);box-shadow:0 5px 0 #d2eaf9,0 9px 18px #087ac912}
    .store-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.store-badge{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#dff3ff,#bce6ff);font-size:25px;box-shadow:inset 0 2px 3px #fff}
    .store-head h2{margin:0;color:#07569a;font-size:22px}.store-head p{margin:4px 0 0;color:#52728a;font-size:12px;line-height:1.4}
    .store-empty{padding:22px 14px;text-align:center;border:1.5px dashed #9bd5f7;border-radius:15px;background:#f8fcff}

    .store-note{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:99px;background:#e5f5ff;color:#07569a;font-size:11px;font-weight:800}
    .footer{box-shadow:0 -4px 0 #087ac9}
    @media(max-width:420px){.proto-hero{padding:20px 15px}.proto-nav{gap:5px}.proto-nav a{font-size:11px;padding:9px 10px}.proto-store{padding:13px}.store-head h2{font-size:20px}}

    /* Bilah status dan tombol menu: tambahan minimal, desain utama tetap */
    .jos-topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 2px 2px}
    .jos-online{display:inline-flex;align-items:center;gap:7px;color:#07569a;font-size:12px;font-weight:800}
    .jos-online-dot{width:9px;height:9px;border-radius:50%;background:#20c878;box-shadow:0 0 0 3px #20c87822}
    .jos-menu-toggle{width:42px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #b9dff5;border-radius:10px;background:linear-gradient(180deg,#fff,#e8f6ff);box-shadow:0 3px 0 #a8d8f1;cursor:pointer}
    .jos-menu-toggle span{display:block;width:19px;height:2.5px;border-radius:5px;background:#07569a;transition:transform .18s,opacity .18s}
    .jos-menu-toggle[aria-expanded="false"] span:first-child{transform:none}
    .jos-menu-toggle[aria-expanded="false"] span:nth-child(2){opacity:1}
    .jos-menu-toggle[aria-expanded="false"] span:last-child{transform:none}
    #josMainNav.menu-collapsed{display:none}
    #josMainNav:not(.menu-collapsed){position:fixed!important;z-index:9999;left:0;top:0;bottom:0;width:min(82vw,330px);height:100dvh;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;padding:90px 18px 24px;background:linear-gradient(180deg,#fff,#edf8ff);border:0;border-radius:0 20px 20px 0;box-shadow:8px 0 30px #003b6b40}
